<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Assignment Reminder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>👋 Welcome Back</h1>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="full">LOGIN</button>
    </form>
    <p class="link-text">No account yet? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await apiRequest('/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    saveSession(data.token, data.student);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = err.error || 'Login failed.';
    errorMsg.style.display = 'block';
  }
});
</script>
</body>
</html>
