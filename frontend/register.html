<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Assignment Reminder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>🎓 Student Register</h1>
    <div class="error-msg" id="errorMsg"></div>
    <form id="registerForm">
      <div class="field">
        <label>Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="full">REGISTER</button>
    <p class="link-text">Already have an account? <a href="login.html">Login</a></p>
  </form>
</div>
</div>

<script src="api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    // Move these inside the event function so they fetch values ON SUBMIT
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const data = await apiRequest('/register', {
            method: 'POST',
            body: JSON.stringify({ name, email, password })
        });
        
        saveSession(data.token, data.student);
        window.location.href = 'dashboard.html';
        
    } catch (err) {
        console.error("Full Error Details:", err);
        errorMsg.textContent = 'Registration failed.';
        errorMsg.style.display = 'block';
    }
});
</script>

</body>
</html>
